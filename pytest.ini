
[pytest]

pythonpath = .

# default test discovery path
testpaths = tests

# test file and function naming rules
python_files = test_*.py
python_functions = test_*

# default command line options
# addopts = -ra
addopts = --headed --browser chromium --base-url=https://tap-vt26-testautomatisering.github.io/exam/

# custom test markers
markers =
    unit: Unit tests
    integration: Integration tests

testpaths = tests